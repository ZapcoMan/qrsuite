// QRSuite 移动端 —— 原生 CameraX + ML Kit 条码扫描
plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) { localProps.load(new FileInputStream(lp)) }
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_SDK_ROOT') ?: 'E:/学习/Android/sdk'

// 发布签名：凭据放在仓库外（06-构建产物/android/signing.properties），不进版本库。
// 找不到就退回 debug 签名，并在构建时明确警告，避免误发 debug 签名包。
def releaseSigning = null
def signingCandidates = [
        System.getenv('QRSUITE_SIGNING_PROPERTIES'),
        'E:/学习/qcode/06-构建产物/android/signing.properties',
        rootProject.file('signing.properties').absolutePath,
]
for (def path : signingCandidates) {
    if (!path) continue
    def f = new File(path)
    if (f.exists()) {
        def p = new Properties()
        f.withInputStream { p.load(it) }
        if (p.getProperty('storeFile')) {
            releaseSigning = p
            break
        }
    }
}

android {
    namespace 'com.qrsuite.scanner'
    compileSdk 35

    if (releaseSigning != null) {
        signingConfigs {
            release {
                storeFile new File(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'com.qrsuite.scanner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0.3'
        resourceConfigurations += ['zh', 'en']

        // 只打 64 位 ARM（现代安卓机）；x86/armeabi 仅为模拟器与老设备所需，去掉可省近半体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 只保留需要的 ABI/资源，APK 更小
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'DebugProbesKt.bin']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('[QRSuite] 未找到 signing.properties，回退为 debug 签名（不适合对外发布）')
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // 相机：camera2 之上的稳定封装
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // 条码识别：bundled 版模型打进 APK，完全离线可用
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
