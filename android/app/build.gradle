// QRSuite 绉诲姩绔?鈥斺€?鍘熺敓 CameraX + ML Kit 鏉＄爜鎵弿
plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) { localProps.load(new FileInputStream(lp)) }
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_SDK_ROOT') ?: 'E:/瀛︿範/Android/sdk'

// 鍙戝竷绛惧悕锛氫紭鍏堢敤鐜鍙橀噺锛圕I 浠?Secrets 娉ㄥ叆锛夛紝鍚﹀垯璇讳粨搴撳鐨?signing.properties銆?// 涓よ€呴兘娌℃湁灏遍€€鍥?debug 绛惧悕骞舵槑纭鍛婏紝閬垮厤璇彂 debug 绛惧悕鍖呫€?def releaseSigning = null
if (System.getenv('QRSUITE_KEYSTORE')) {
    // CI 璺緞锛欸itHub Actions 瑙ｇ爜 keystore 鍚庢妸璺緞涓庡彛浠ゆ斁杩涚幆澧冨彉閲?    releaseSigning = [
            storeFile    : System.getenv('QRSUITE_KEYSTORE'),
            storePassword: System.getenv('QRSUITE_STORE_PASSWORD'),
            keyAlias     : System.getenv('QRSUITE_KEY_ALIAS'),
            keyPassword  : System.getenv('QRSUITE_KEY_PASSWORD'),
    ]
} else {
    def signingCandidates = [
            System.getenv('QRSUITE_SIGNING_PROPERTIES'),
            'E:/瀛︿範/qcode/06-鏋勫缓浜х墿/android/signing.properties',
            rootProject.file('signing.properties').absolutePath,
    ]
    for (def path : signingCandidates) {
        if (!path) continue
        def f = new File(path)
        if (f.exists()) {
            def p = new Properties()
            f.withInputStream { p.load(it) }
            if (p.getProperty('storeFile')) {
                releaseSigning = p
                break
            }
        }
    }
}

def signVal = { cfg, key ->
    if (cfg instanceof Map) return cfg[key]
    return cfg.getProperty(key)
}

android {
    namespace 'com.qrsuite.scanner'
    compileSdk 35

    if (releaseSigning != null) {
        signingConfigs {
            release {
                storeFile new File(signVal(releaseSigning, 'storeFile'))
                storePassword signVal(releaseSigning, 'storePassword')
                keyAlias signVal(releaseSigning, 'keyAlias')
                keyPassword signVal(releaseSigning, 'keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'com.qrsuite.scanner'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.4'
        resourceConfigurations += ['zh', 'en']

        // 鍙墦 64 浣?ARM锛堢幇浠ｅ畨鍗撴満锛夛紱x86/armeabi 浠呬负妯℃嫙鍣ㄤ笌鑰佽澶囨墍闇€锛屽幓鎺夊彲鐪佽繎鍗婁綋绉?        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 鍙繚鐣欓渶瑕佺殑 ABI/璧勬簮锛孉PK 鏇村皬
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'DebugProbesKt.bin']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('[QRSuite] 鏈壘鍒?signing.properties锛屽洖閫€涓?debug 绛惧悕锛堜笉閫傚悎瀵瑰鍙戝竷锛?)
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // 鐩告満锛歝amera2 涔嬩笂鐨勭ǔ瀹氬皝瑁?    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // 鏉＄爜璇嗗埆锛歜undled 鐗堟ā鍨嬫墦杩?APK锛屽畬鍏ㄧ绾垮彲鐢?    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
