# QRSuite Windows 构建（单文件 exe）
#
# 打 tag 时构建 Windows 单文件版并上传到对应 Release。
# 若配置了代码签名证书 Secrets，则一并签名；未配置则构建未签名版本并在日志中提示。
#
# 可选 Secrets（不配置也能跑，只是产物无签名）：
#   WINDOWS_CERT_PFX_BASE64   .pfx 证书的 base64
#   WINDOWS_CERT_PASSWORD     .pfx 口令
name: Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        run: python tools/build_windows.py --dist dist

      - name: Sign (only when a certificate is configured)
        id: sign
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_B64)) {
            Write-Host "未配置 WINDOWS_CERT_PFX_BASE64 —— 跳过签名（exe 发布后用户会看到 SmartScreen 提示）"
            echo "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $env:QRSUITE_SIGN_PFX = $pfx
          $env:QRSUITE_SIGN_PFX_PASS = $env:CERT_PW
          python tools/build_windows.py --dist dist --sign --no-build
          echo "signed=true" >> $env:GITHUB_OUTPUT

      - name: Attach exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag }}" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QRSuite $tag" --notes "见仓库 README 与 CHANGELOG。"
          }
          gh release upload $tag dist/QRSuite.exe --clobber
          gh release view $tag --json assets --jq '.assets[].name'
