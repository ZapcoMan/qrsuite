# QRSuite Android 发布
#
# 打 tag（如 v2.0.4）时自动构建**正式签名**的 release APK，并上传到对应的 GitHub Release。
#
# 签名材料来自仓库 Secrets（不进代码库）：
#   SIGNING_KEYSTORE_BASE64  keystore 文件的 base64
#   SIGNING_STORE_PASSWORD   keystore 口令
#   SIGNING_KEY_ALIAS        key 别名
#   SIGNING_KEY_PASSWORD     key 口令
name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/覆盖的 tag（需已存在）'
        required: true

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (official cmdline-tools)
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::缺少 secret SIGNING_KEYSTORE_BASE64，无法正式签名"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore 已还原: $(stat -c%s "$RUNNER_TEMP/release.jks") 字节"

      - name: Build signed release APK
        working-directory: android
        env:
          QRSUITE_KEYSTORE: ${{ runner.temp }}/release.jks
          QRSUITE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          QRSUITE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          QRSUITE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain :app:assembleRelease

      - name: Verify signature is NOT the debug key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK 仍是 debug 签名，Secrets 可能未生效"
            exit 1
          fi
          echo "签名校验通过（非 debug 证书）"

      - name: Rename APK
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "versionName\s+'\K[^']+" android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/QRSuite-${VERSION}-arm64.apk"
          ls -lh out/

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # release 可能已存在（手工创建），存在则直接补附件
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "QRSuite $TAG" --notes "见仓库 README 与 CHANGELOG。"
          gh release upload "$TAG" out/*.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
